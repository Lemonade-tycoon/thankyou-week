<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thank-You Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Caveat:wght@700&family=IBM+Plex+Mono:wght@600&family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/profile.css">
<style>
:root{--bg:#f3efe6;--ink:#1d1f27;--muted:#646877;--note:#ffe577;--accent:#e2553d;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Figtree",system-ui,sans-serif;
  padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:grid;place-items:center}
main{width:100%;max-width:420px;display:grid;gap:22px;justify-items:center;text-align:center}
.note{width:100%;background:var(--note);padding:28px 24px 24px;box-shadow:0 14px 24px -14px rgba(60,45,0,.45);transform:rotate(-1deg);position:relative;display:grid;gap:14px}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.6)}
.eyebrow{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#6b5a1a}
h1{margin:0;font:800 34px/1.05 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em}
.note p{margin:0;color:#4d4220}
form{display:grid;gap:10px;margin-top:4px}
input{font:18px "Figtree",sans-serif;padding:13px 14px;border-radius:10px;border:2px solid #1d1f27;background:#fffbe6;text-align:center;color:var(--ink)}
button{font:800 16px "Figtree",sans-serif;padding:13px;border-radius:10px;border:0;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{min-height:1.5em;font-size:14px;font-weight:600;color:#a8321f}
.sign{font:700 26px "Caveat",cursive;color:#6b5a1a;transform:rotate(-2deg)}
.again{font-size:14px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px;font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px) rotate(-1deg)}75%{transform:translateX(6px) rotate(-1deg)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<main>
  <section class="note" id="lock">
    <div class="eyebrow">Thank-You Week</div>
    <h1>Solve your riddle to unlock your stats</h1>
    <p>Type the answer to the riddle on your sticky note.</p>
    <form id="f" autocomplete="off">
      <input id="answer" type="text" placeholder="Your answer" aria-label="Riddle answer" autocapitalize="off" spellcheck="false" required>
      <button id="go" type="submit">Unlock my stats</button>
    </form>
    <div class="msg" id="msg" role="status"></div>
    <div class="sign">— IT HENSEM</div>
  </section>
  <div id="out" hidden></div>
  <button class="again" id="again" type="button" hidden>Lock it again</button>
</main>
<script type="module">
import { unlock, profileHTML } from "/lib.js";
const $ = (id) => document.getElementById(id);
let data = null;
const load = fetch("/data.json", { cache: "no-store" }).then((r) => r.json()).then((d) => (data = d))
  .catch(() => { $("msg").textContent = "Couldn't load the page data. Check your connection and refresh."; });

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true; $("go").textContent = "Checking…"; $("msg").textContent = "";
  try {
    await load;
    const p = data && (await unlock(data, $("answer").value));
    if (!p) {
      $("msg").textContent = "Not quite. Check the hint on your note and try again.";
      $("lock").classList.remove("shake"); void $("lock").offsetWidth; $("lock").classList.add("shake");
      return;
    }
    $("out").innerHTML = profileHTML(p);
    $("out").firstElementChild.classList.add("reveal");
    document.title = p.name + " · Thank-You Week";
    $("lock").hidden = true; $("out").hidden = false; $("again").hidden = false;
    window.scrollTo({ top: 0 });
  } catch {
    $("msg").textContent = "Something went wrong. Please try again.";
  } finally {
    $("go").disabled = false; $("go").textContent = "Unlock my stats";
  }
});
$("again").onclick = () => {
  $("out").innerHTML = ""; $("out").hidden = true; $("again").hidden = true;
  $("lock").hidden = false; $("answer").value = ""; $("answer").focus(); document.title = "Thank-You Week";
};
</script>
</body>
</html>
